name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CareerSync Backend
        run: |
          echo "Pinging CareerSync Backend..."
          curl -s https://careersync-backend-msr.onrender.com/ > /dev/null
          echo "Ping successful!"
